[package]
name = "knowbee-yeonjang"
version = "0.1.0"
edition = "2024"
description = "Rust extension node for Knowbee system control and local automation"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
directories = "5.0"
fs2 = "0.4"
hmac = "0.12"
iced = { version = "0.14.0", features = ["tokio"] }
png = "0.17"
rumqttc = "0.24"
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.30"
tray-icon = "0.20"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2.11"
security-framework-sys = "2.17"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

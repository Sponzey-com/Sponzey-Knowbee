[package]
name = "knowbee-yeonjang"
version = "0.1.0"
edition = "2024"
description = "Rust extension node for Knowbee system control and local automation"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
directories = "5.0"
fs2 = "0.4"
hmac = "0.12"
iced = { version = "0.14.0", features = ["tokio"] }
png = "0.17"
rumqttc = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.30"
tray-icon = "0.20"
